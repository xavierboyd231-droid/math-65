<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - Unblocked Games</title>
    <style>
        :root {
            --bg-color: #0f1016;
            --card-bg: #1a1c29;
            --accent-color: #7289da;
            --text-color: #ffffff;
            --text-secondary: #99aab5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #23272a;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent-color);
        }

        header p {
            margin: 5px 0 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .search-container {
            padding: 15px;
            text-align: center;
        }

        #searchBar {
            width: 80%;
            max-width: 400px;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 25px;
            border: 2px solid #23272a;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }

        #searchBar:focus {
            border-color: var(--accent-color);
        }

        /* Game Grid View */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #23272a;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(114, 137, 218, 0.2);
            border-color: var(--accent-color);
        }

        .game-img {
            width: 100%;
            height: 120px;
            background-color: #2c2f33;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .game-info {
            padding: 12px;
            text-align: center;
        }

        .game-info h3 {
            margin: 0 0 5px;
            font-size: 1rem;
        }

        .game-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Player View (Hidden by default) */
        #player-view {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 10px;
            box-sizing: border-box;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            opacity: 0.9;
        }

        #gameFrame {
            width: 100%;
            flex: 1;
            min-height: 500px;
            border: 2px solid #23272a;
            border-radius: 10px;
            background-color: #000;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 2px solid #23272a;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Arcade Hub</h1>
        <p>Bored in class? We got you.</p>
    </header>

    <!-- MAIN MENU -->
    <div id="menu-view">
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search for a game..." onkeyup="searchGames()">
        </div>

        <div class="game-grid" id="gameGrid">
            <!-- Game 1: 2048 (Embeds nicely) -->
            <div class="game-card" onclick="playGame('https://play2048.co/', '2048')" data-name="2048 puzzle numbers">
                <div class="game-img">🔢</div>
                <div class="game-info">
                    <h3>2048</h3>
                    <p>Puzzle Game</p>
                </div>
            </div>

            <!-- Game 2: Pac-Man style or HTML5 game wrapper -->
            <div class="game-card" onclick="playGame('https://www.google.com/logos/2010/pacman10-i.html', 'Pac-Man')" data-name="pacman arcade retro">
                <div class="game-img">🕹️</div>
                <div class="game-info">
                    <h3>Pac-Man</h3>
                    <p>Classic Arcade</p>
                </div>
            </div>

            <!-- Game 3: Tiny Fishing / HTML5 test -->
            <div class="game-card" onclick="playGame('https://html5.gamedistribution.com/rvvASMiM/a8726beea7dc4020a672e1c94447fc09/', 'Tiny Fishing')" data-name="tiny fishing arcade">
                <div class="game-img">🎣</div>
                <div class="game-info">
                    <h3>Tiny Fishing</h3>
                    <p>Fishing Game</p>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME PLAYER VIEW -->
    <div id="player-view">
        <div class="player-header">
            <button class="back-btn" onclick="goHome()">⬅ Back to Games</button>
            <h2 id="gameTitle" style="margin:0; font-size: 1.2rem;">Game</h2>
            <div style="width: 80px;"></div> <!-- Spacer to center title -->
        </div>
        <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>

    <footer>
        <p>&copy; 2026 Arcade Hub. All games embedded locally.</p>
    </footer>

    <script>
        function playGame(url, title) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            document.getElementById('gameTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
        }

        function goHome() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('gameFrame').src = ''; // Stops the game from running in background
        }

        function searchGames() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                if (name.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
