<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tools - Educational Utilities</title>
    <style>
        :root {
            --bg-color: #12141d;
            --card-bg: #1b1e2b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #2d3748;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area p {
            margin: 4px 0 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .search-container {
            padding: 25px 20px 10px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        #searchBar {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        #searchBar:focus {
            border-color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
            border: 1px solid var(--border-color);
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-color);
        }

        .game-img {
            width: 100%;
            height: 130px;
            background: linear-gradient(135deg, #1f2937, #111827);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .game-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .game-info h3 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .game-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Player View */
        #player-view {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: var(--border-color);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 600px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>📐 Math Tools</h1>
            <p>Advanced calculation & graphing utilities</p>
        </div>
    </header>

    <!-- MAIN MENU -->
    <div id="menu-view">
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search calculation modules..." onkeyup="searchGames()">
        </div>

        <div class="container">
            <div class="section-title">Available Modules</div>
            <div class="game-grid" id="gameGrid">
                
                <!-- Subway Surfers -->
                <div class="game-card" onclick="playGame('https://subwaysurfers.me/', 'Subway Surfers')" data-name="subway surfers runner calculation">
                    <div class="game-img">🏃‍♂️</div>
                    <div class="game-info">
                        <h3>Subway Surfers</h3>
                        <p>Velocity & Motion Simulator</p>
                    </div>
                </div>

                <!-- Retro Bowl -->
                <div class="game-card" onclick="playGame('https://retrobowl.me/', 'Retro Bowl')" data-name="retro bowl sports statistics">
                    <div class="game-img">🏈</div>
                    <div class="game-info">
                        <h3>Retro Bowl</h3>
                        <p>Probability & Statistics</p>
                    </div>
                </div>

                <!-- 2048 -->
                <div class="game-card" onclick="playGame('https://play2048.co/', '2048')" data-name="2048 math puzzle numbers">
                    <div class="game-img">🔢</div>
                    <div class="game-info">
                        <h3>2048</h3>
                        <p>Exponential Growth Logic</p>
                    </div>
                </div>

                <!-- Slope -->
                <div class="game-card" onclick="playGame('https://kbhgames.com/game/slope', 'Slope')" data-name="slope geometry physics">
                    <div class="game-img">⛰️</div>
                    <div class="game-info">
                        <h3>Slope</h3>
                        <p>Physics & Angles Matrix</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- PLAYER VIEW -->
    <div id="player-view">
        <div class="player-header">
            <button class="back-btn" onclick="goHome()">← Back to Modules</button>
            <h2 id="gameTitle" style="margin:0; font-size: 1.1rem; color: var(--text-secondary);">Module</h2>
            <div style="width: 100px;"></div>
        </div>
        <div class="iframe-container">
            <iframe id="gameFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Math Tools Inc. Internal Student Portal.</p>
    </footer>

    <script>
        function playGame(url, title) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            document.getElementById('gameTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
        }

        function goHome() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('gameFrame').src = ''; 
        }

        function searchGames() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name');
                if (name.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
